name: PostgreSQL Migration Integration

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: PostgreSQL 16 migrations and persistence
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Run PostgreSQL migration integration test
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=PostgresIntegrationTest test

      - name: Ensure PostgreSQL integration test was executed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/surefire-reports/TEST-com.example.efficientia.integration.PostgresIntegrationTest.xml")
          if not report.is_file():
              raise SystemExit(f"Surefire report not found: {report}")

          suite = ET.parse(report).getroot()
          tests = int(suite.attrib.get("tests", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          if tests != 1 or skipped or errors or failures:
              raise SystemExit(
                  f"Expected one executed PostgreSQL integration test; "
                  f"got tests={tests}, skipped={skipped}, errors={errors}, failures={failures}"
              )
          print("PostgreSQL integration test ran successfully (1 test, 0 skipped).")
          PY
