name: Maven Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven wrapper
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always() # Upload report even if tests/coverage fail
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
