name: Maven Verify

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Build, test, and enforce JaCoCo thresholds
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('target/site/jacoco/index.html') != '' }}
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
