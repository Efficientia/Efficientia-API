spring.application.name=efficientia
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.shutdown=graceful
app.version=@project.version@
app.commit=${RENDER_GIT_COMMIT:unknown}
spring.profiles.default=local
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Storage privado local. O nome original nunca compõe a chave física.
app.document-storage.path=${DOCUMENT_STORAGE_PATH:./data/documentos}
app.document-storage.max-pdf-size=${MAX_PDF_SIZE:25MB}
app.document-storage.max-png-size=${MAX_PNG_SIZE:10MB}

# O limite global barra requisições maiores antes do controller. O storage
# ainda aplica o limite específico de cada MIME durante o streaming.
spring.servlet.multipart.max-file-size=${MAX_PDF_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_MULTIPART_REQUEST_SIZE:26MB}

# A conexão real fica no perfil local/ambiente. Nunca versionar a senha.
spring.datasource.hikari.pool-name=efficientia-pool

# Login por codigo de uso unico. Configure MAIL_* no ambiente de deploy.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:}

# DTOs públicos rejeitam campos desconhecidos em vez de ignorá-los.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Resource Server e Autenticação JWT (HS256)
app.security.enabled=${SECURITY_ENABLED:true}
app.security.secret=${JWT_SECRET:efficientia-secret-key-must-be-at-least-32-bytes-long!}
app.jwt.secret=${app.security.secret}
app.security.issuer=${JWT_ISSUER_URI:efficientia-api}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:}
app.security.audience=${JWT_AUDIENCE:efficientia-api}
app.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
# Nível de log de autenticação OAuth2 / Resource Server (diagnóstico seguro sem exibir credenciais)
logging.level.org.springframework.security.oauth2.server.resource=INFO

# Permite que o Hibernate crie schemas automaticamente (necessario para H2 e novos schemas)
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Integracao Redis / Upstash
spring.data.redis.url=${REDIS_URL:}
app.redis.stream.viagens=${REDIS_STREAM_VIAGENS:efficientia:events:viagens}
app.redis.leaderboard.key=${REDIS_LEADERBOARD_KEY:efficientia:leaderboard:motoristas}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# Desativa a varredura desnecessaria de repositorios Redis (evita multi-store scan e reduz tempo de boot)
spring.data.redis.repositories.enabled=false
